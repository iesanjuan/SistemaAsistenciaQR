name: Mantener Supabase activo

# Evita que el proyecto de Supabase (plan gratuito) se pause tras 7 días sin
# actividad. Hace una pequeña consulta de LECTURA a la API REST una vez al día,
# lo que cuenta como tráfico externo y reinicia el contador de inactividad.
#
# Requiere dos "secrets" en el repo (Settings > Secrets and variables > Actions):
#   - SUPABASE_URL        -> el valor de VITE_SUPABASE_URL  (https://XXXX.supabase.co)
#   - SUPABASE_ANON_KEY   -> el valor de VITE_SUPABASE_ANON_KEY

on:
  schedule:
    # Todos los días a las 12:00 UTC (07:00 en Perú). El cron usa SIEMPRE UTC.
    - cron: '0 12 * * *'
  # Permite lanzarlo a mano desde la pestaña "Actions" para probar.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta de lectura a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY en el repositorio."
            exit 1
          fi

          echo "Consultando ${SUPABASE_URL}/rest/v1/estudiantes ..."
          codigo=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/estudiantes?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Respuesta HTTP: ${codigo}"
          echo "Cuerpo: $(cat /tmp/resp.txt)"

          if [ "$codigo" -ge 200 ] && [ "$codigo" -lt 400 ]; then
            echo "OK: Supabase respondió correctamente. Proyecto marcado como activo."
          else
            echo "::error::Supabase respondió con código ${codigo}. Revisa la URL, la anon key o si el proyecto ya está pausado."
            exit 1
          fi
